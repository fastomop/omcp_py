[project]
name = "omcp_py"
version = "0.1.0"
description = "A secure Python code execution sandbox for MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "flask>=3.0.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "docker>=7.0.0,<8.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<4.0",
    "fastmcp>=0.1.0,<1.0.0",
    "pandas>=1.5.0,<3.0.0",
    "duckdb>=0.8.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "black>=24.0.0,<25.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.6.0,<3.0.0",
]

[project.scripts]
omcp-sandbox = "omcp_py.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omcp_py"]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "black>=24.0.0,<25.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.6.0,<3.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --strict-config -ra --tb=short"
markers = [
    "integration: integration tests (deselect with '-m \"not integration\"')",
    "slow: slow tests (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/omcp_py"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/distutils/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

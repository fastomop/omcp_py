version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: omop
      POSTGRES_USER: omop_user
      POSTGRES_PASSWORD: omop_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount Synthea data directory
      - ./synthetic_data:/synthetic_data:ro

volumes:
  pgdata:

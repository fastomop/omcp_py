version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: omop
      POSTGRES_USER: omop_user
      POSTGRES_PASSWORD: omop_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Uncomment the next line and provide a SQL file to initialize with OMOP schema/data
      # - ./synthetic_omop_dump.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:

version: '3.8'
services:
  db:
    image: fastomop/postgres:from-tar
    environment:
      POSTGRES_DB: omcp
      POSTGRES_USER: omcp
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount Synthea data directory
      - ./synthetic_data:/synthetic_data:ro

volumes:
  pgdata:
